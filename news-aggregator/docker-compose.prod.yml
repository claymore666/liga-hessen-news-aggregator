# =============================================================================
# ENVIRONMENT: docker-ai (Production)
# =============================================================================
# This compose file is for docker-ai (production environment).
# Workers and scheduler are ENABLED by default for automatic processing.
# Sends WoL packets to gpu1 for LLM processing during active hours.
#
# Environment files:
#   - docker-compose.yml      -> gpu1 (QA) - workers disabled, includes classifier
#   - docker-compose.prod.yml -> docker-ai (Production) - workers enabled, includes classifier
#   - docker-compose.training.yml -> classifier training
#
# The classifier API runs here as a lightweight container (embeddings via Ollama
# proxy on docker-ai port 11434, which forwards to gpu1 Ollama).
# =============================================================================

# Network for LAN access (Wake-on-LAN)
networks:
  default:
    # Default bridge for inter-container communication (db access)
  lan:
    # Shared external network created on the host via the
    # docker-net-dhcp plugin so the backend gets a DHCP-issued IP
    # from the LAN router. Replaced the previous static-IPAM macvlan
    # (range .208/29) after recurring static-IP collisions with the
    # D-Link switch on .200 — see Jan 4 LAN outage.
    #
    # Create on the host once (parent NIC: ens18 on docker-ai):
    #   docker plugin install ghcr.io/claymore666/docker-net-dhcp:v0.9.0
    #   docker network create \
    #     --driver=ghcr.io/claymore666/docker-net-dhcp:v0.9.0 \
    #     --ipam-driver=null \
    #     -o mode=macvlan -o parent=ens18 lan-shared
    external: true
    name: lan-shared
  ollamaproxy:
    # Cross-stack network owned by the ollamaproxy compose project on docker-ai.
    # Backend joins it to reach the Ollama proxy backplane (alias: ollamaproxy)
    # by Docker DNS instead of the host docker0 IP, which is unreachable from
    # the macvlan-attached backend.
    external: true
    name: ollamaproxy_default

services:
  redis:
    image: redis:7-alpine
    container_name: liga-news-redis
    restart: unless-stopped
    mem_limit: 256m
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  db:
    image: pgvector/pgvector:pg17
    container_name: liga-news-db
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: liga_news
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d liga_news"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liga-news-backend
    init: true  # tini reaps zombie healthcheck processes (gunicorn doesn't wait() orphans)
    restart: unless-stopped
    mem_limit: 2g
    ulimits:
      core: 0  # Disable core dumps to prevent disk exhaustion
    pids_limit: 500  # Prevent runaway Chrome processes - 2 browsers × ~100 PIDs each + headroom
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql+asyncpg://liga:${POSTGRES_PASSWORD}@db:5432/liga_news
      - LLM_ENABLED=${LLM_ENABLED:-true}
      # Reach the Ollama proxy backplane via the shared ollamaproxy_default
      # network. Backend's macvlan default route can't reach docker0
      # (172.17.0.1), so name-based DNS over the proxy network is required.
      - OLLAMA_BASE_URL=http://ollamaproxy:11434
      - OLLAMA_MODEL=gpt-oss-120b
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-mistralai/mistral-7b-instruct:free}
      # Embedding classifier (runs locally on docker-ai, embeddings via Ollama proxy)
      - CLASSIFIER_URL=http://classifier:8082
      - CLASSIFIER_THRESHOLD=${CLASSIFIER_THRESHOLD:-0.8}
      - CLASSIFIER_ENABLED=${CLASSIFIER_ENABLED:-true}
      - CLASSIFIER_USE_PRIORITY=${CLASSIFIER_USE_PRIORITY:-false}
      - CLASSIFIER_USE_AK=${CLASSIFIER_USE_AK:-false}
      # GPU1 Power Management (Wake-on-LAN)
      - GPU1_WOL_ENABLED=${GPU1_WOL_ENABLED:-true}
      - GPU1_MAC_ADDRESS=${GPU1_MAC_ADDRESS:-58:47:ca:7c:18:cc}
      - GPU1_BROADCAST=${GPU1_BROADCAST:-192.168.0.255}
      - GPU1_SSH_HOST=${GPU1_SSH_HOST:-gpu1.fritz.box}
      - GPU1_SSH_USER=${GPU1_SSH_USER:-ligahessen}
      - GPU1_SSH_KEY_PATH=/app/ssh/id_ed25519
      - GPU1_AUTO_SHUTDOWN=${GPU1_AUTO_SHUTDOWN:-true}
      - GPU1_IDLE_TIMEOUT=${GPU1_IDLE_TIMEOUT:-60}
      - GPU1_WAKE_INTERVAL=${GPU1_WAKE_INTERVAL:-3600}
      - GPU1_WAKE_TIMEOUT=${GPU1_WAKE_TIMEOUT:-120}
      - GPU1_ACTIVE_HOURS_START=${GPU1_ACTIVE_HOURS_START:-7}
      - GPU1_ACTIVE_HOURS_END=${GPU1_ACTIVE_HOURS_END:-16}
      - GPU1_ACTIVE_WEEKDAYS_ONLY=${GPU1_ACTIVE_WEEKDAYS_ONLY:-true}
      # Worker/Scheduler control (can disable for testing)
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - LLM_WORKER_ENABLED=${LLM_WORKER_ENABLED:-true}
      - CLASSIFIER_WORKER_ENABLED=${CLASSIFIER_WORKER_ENABLED:-true}
      # Title pre-filter disabled: can't achieve 0 false negatives (see docs/services/TITLE_PREFILTER_EVALUATION.md)
      - TITLE_PREFILTER_ENABLED=${TITLE_PREFILTER_ENABLED:-false}
      - TITLE_PREFILTER_MODEL=${TITLE_PREFILTER_MODEL:-qwen3:8b}
      - DUPLICATE_CHECK_DAYS=${DUPLICATE_CHECK_DAYS:-7}
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_POOL_MAX=${BROWSER_POOL_MAX:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Daily digest
      - DIGEST_ENABLED=${DIGEST_ENABLED:-false}
      - DIGEST_RECIPIENTS=${DIGEST_RECIPIENTS:-}
      - DIGEST_CUTOFF_HOUR=${DIGEST_CUTOFF_HOUR:-17}
      - DIGEST_SEND_DELAY_MINUTES=${DIGEST_SEND_DELAY_MINUTES:-10}
      # SMTP relay (Docker host Postfix)
      - SMTP_HOST=${SMTP_HOST:-172.21.0.1}
    volumes:
      - backend-data:/app/data
      - ./ssh:/app/ssh:ro  # SSH key for gpu1 shutdown
      - ./backend/prompts:/app/prompts:ro  # LLM prompt files (title pre-filter)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      classifier:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      default:  # For db connectivity
      lan:
      ollamaproxy:  # Reach Ollama proxy backplane by name (http://ollamaproxy:11434)
    # Docker's embedded DNS (127.0.0.11) sometimes drops responses when the
    # upstream LAN resolver (192.168.0.9) is slow, causing intermittent failures
    # resolving gpu1.fritz.box for the gpu1_power user-check / shutdown SSH.
    # Make glibc retry instead of returning NXDOMAIN on the first timeout.
    dns_opt:
      - timeout:2
      - attempts:3
      - ndots:0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liga-news-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Classifier API - lightweight stateless container, embeddings via Ollama proxy, vectors via pgvector
  classifier:
    build:
      context: ../relevance-tuner/services/classifier-api
      dockerfile: Dockerfile
    container_name: liga-classifier
    init: true  # tini reaps zombie healthcheck processes (uvicorn doesn't wait() orphans)
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Reach the Ollama embeddings backplane via the shared ollamaproxy_default
      # network (same pattern as backend). The previous host-bridge URL
      # (172.17.0.1:11434) stopped working once ollama-embeddings moved into
      # the ollamaproxy stack with no host port mapping.
      - OLLAMA_BASE_URL=http://ollamaproxy:11434
      - DATABASE_URL=postgresql://liga:${POSTGRES_PASSWORD}@db:5432/liga_news
    volumes:
      - ../relevance-tuner/services/classifier-api/models:/app/models
    depends_on:
      db:
        condition: service_healthy
    # No host port mapping needed — backend connects via Docker network (http://classifier:8082)
    # Port 8082 on host is used by the Ollama proxy (forwarding to gpu1:8082 for legacy access)
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - ollamaproxy

volumes:
  postgres-data:
    name: liga-news-postgres
  backend-data:
    name: liga-news-data
